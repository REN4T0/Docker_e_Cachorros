<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/dog_register.css">
    <link rel="stylesheet" href="../css/components/modal.css">
    <link rel="stylesheet" href="../css/components/alert.css">
    <script type="module" src="../js/services/get_form.js" defer></script>
    <title>Cadastrar cachorro</title>
</head>

<body>
    <form class="register_form">
        <a href="#" class="back-to-index">Voltar</a>
        <h1>Cadastrar cachorro</h1>
        <fieldset>
            <legend>Raça</legend>
            <select type="text" name="breed" id="breed" placeholder="Selecione a raça do cão" class="dog_info breed">
                <option value="" hidden>Selecione a raça do cachorro</option>
            </select>
        </fieldset>

        <fieldset>
            <legend>Apelido</legend>
            <input type="text" name="surname" id="surname" placeholder="Ex: Leônidas" class="dog_info">
        </fieldset>

        <fieldset>
            <legend>Gênero</legend>
            <select name="gender" id="gender" class="dog_info">
                <option value="" hidden>Informe o gênero do cachorro</option>
                <option value="M">Macho</option>
                <option value="F">Fêmea</option>
            </select>
        </fieldset>

        <button type="submit" class="send">Cadastrar cachorro</button>
    </form>

    <div>
    </div>

    <div class="alert">
        <p>alert!</p>
    </div>

    <table>
        <thead>
            <tr>
                <td colspan="5"><input type="text" name="search" id="search"
                        placeholder="Pesquise aqui pelo apelido..."></td>
                <td><button class="search"><img src="../icons/search.svg" alt="ícone de pesquisa"
                            class="search-icon"></button></td>
            </tr>
            <tr>
                <th>ID</th>
                <th>Raça</th>
                <th>Apelido</th>
                <th>Gênero</th>
                <th colspan="2"></th>
            </tr>
        </thead>
    </table>
</body>

</html>
